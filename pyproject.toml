[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-radar"
version = "0.1.0"
description = "Prediction-market data source and analysis framework (ARTi Open Challenge DEV track)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[tool.setuptools]
packages = ["data", "analysis", "agents", "report"]
